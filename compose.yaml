services:
  app:
    build: .
    image: logentra-os:local
    environment:
      LOGENTRA_PROFILE: production
      LOGENTRA_TIMEZONE: ${LOGENTRA_TIMEZONE:-UTC}
      LOGENTRA_DATABASE_URL: ${LOGENTRA_DATABASE_URL:-sqlite:////app/data/logentra.db}
      LOGENTRA_CORS_ORIGINS: ${LOGENTRA_CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - logentra-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/ready', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  # One-off backup/restore helper. Runs as the app user (10001) with no extra
  # capabilities, so restored files are owned correctly without chown.
  #   docker compose --profile recovery run --rm recovery backup /backups/<name>
  #   docker compose stop app
  #   docker compose --profile recovery run --rm recovery restore /backups/<name> --replace
  #   docker compose start app
  recovery:
    build: .
    image: logentra-os:local
    profiles: [recovery]
    user: "10001:10001"
    entrypoint: ["python", "scripts/recovery.py"]
    command: ["--help"]
    environment:
      LOGENTRA_DATABASE_URL: ${LOGENTRA_DATABASE_URL:-sqlite:////app/data/logentra.db}
    volumes:
      - logentra-data:/app/data
      - logentra-backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  postgres:
    # Pinned by digest. Runs as the image's postgres user (70) so the entrypoint
    # never needs to step down from root; see docs/v0.6/KNOWN_ISSUES.md.
    image: postgres:17.12-alpine3.24@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    profiles: [postgres]
    user: "70:70"
    environment:
      POSTGRES_DB: logentra
      POSTGRES_USER: logentra
      POSTGRES_PASSWORD: ${LOGENTRA_POSTGRES_PASSWORD:-}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "logentra", "-d", "logentra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
volumes:
  logentra-data:
  logentra-backups:
  postgres-data:
