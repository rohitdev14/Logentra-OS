<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick entry · Logentra OS</title>
<style>
:root{color-scheme:light dark;--bg:#f2f3f7;--panel:#fff;--ink:#191b27;--soft:#566173;--line:#d8dce6;--brand:#28236b;--action:#5245db;--danger:#993c20;--ok:#166045}
@media(prefers-color-scheme:dark){:root{--bg:#151c25;--panel:#202b36;--ink:#eef5fa;--soft:#b5c7d8;--line:#415466;--brand:#122943;--action:#5147bd;--danger:#ffb18a;--ok:#72d8ae}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
header{background:var(--panel);color:var(--ink);border-bottom:1px solid var(--line);align-items:center;padding:16px max(16px,calc((100% - 500px)/2));display:flex;justify-content:space-between;gap:1em}
main{max-width:532px;padding:16px;margin:auto}section,fieldset{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;padding:16px;min-width:0}
h1,h2,p{margin:0 0 .65em}h1{font-size:24px}h2{font-size:18px}small,.muted{color:var(--soft)}
label{display:block;font-weight:600;margin-bottom:5px}input,textarea,button,.button{font:inherit;border-radius:8px}input:not([type=checkbox]),textarea{width:100%;min-height:44px;padding:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin-bottom:8px}
textarea{resize:vertical}select{font:inherit;margin-bottom:12px;padding:8px}details{margin:12px 0}summary{cursor:pointer}#saved-values{padding-left:1.2em}button,.button{display:inline-block;min-height:44px;padding:10px 14px;border:1px solid transparent;background:var(--action);color:#fff;font-weight:650;cursor:pointer;text-decoration:none}
button[type=submit]{width:100%}button:disabled{opacity:.65}header .session{display:flex;gap:.8em;align-items:center;font-size:.85em}header button{min-height:auto;padding:0;background:transparent;text-decoration:underline;color:var(--soft)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 3px;text-align:left;border-bottom:1px solid var(--line)}td:last-child{width:34%}
.flag{font-size:13px;color:var(--ok)}.flag[data-warn],.error{color:var(--danger)}.error{white-space:pre-wrap}.values{margin-bottom:12px}

.phone-brand{display:flex;align-items:center;gap:.45rem}.phone-brand span{display:grid;place-items:center;width:26px;height:26px;background:var(--action);color:#fff;border-radius:6px}
.equipment-card h1{margin-bottom:.25em;font-family:ui-monospace,monospace}
.reading-heading{font-size:.82rem;color:var(--soft);text-transform:uppercase}
.reading-meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.3rem}
.reading-meta:first-child{margin-bottom:.4rem}.reading-meta:last-child{margin-top:.4rem}
.reading-meta label{margin:0}.reading-input input{font-size:1.12rem;font-weight:650}
.reading-row[data-warn] input{border-color:var(--danger)}
.table-alert{border-color:var(--danger);color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--panel))}
.equipment-card p{margin:0 0 .3em}
.reading-input{display:flex;gap:.35rem;align-items:center}.reading-input input{min-width:0;margin:0}
.reading-row[data-warn]{background:color-mix(in srgb,var(--danger) 11%,var(--panel));border-color:var(--danger)}
.flag:not(:empty){display:inline-block;padding:.18em .5em;border-radius:1em;background:color-mix(in srgb,var(--ok) 13%,var(--panel));font-weight:700;margin-top:.35rem}
.flag[data-warn]{background:color-mix(in srgb,var(--danger) 16%,var(--panel))}
.save-bar{position:sticky;bottom:0;background:var(--bg);padding:.6rem 0;text-align:center}
#reading-warning{display:block;margin-top:.3rem;color:var(--danger)}
.photo-list{display:flex;gap:.55rem;flex-wrap:wrap;margin-bottom:.55rem}
.photo-list figure{margin:0;width:85px}.photo-list img{width:100%;height:66px;object-fit:cover;border-radius:.45rem}
.photo-list button,.secondary{background:var(--panel);color:var(--ink);border-color:var(--line)}
.photo-list button{font-size:.75rem;padding:.2rem .35rem;min-height:32px;margin-top:.15rem}
</style>
<header><strong class="phone-brand"><span aria-hidden="true">L</span> Logentra OS</strong><div id="session" class="session" hidden><span id="operator"></span><button type="button" id="signout">Sign out</button></div></header>
<main>@@CONTENT@@</main>
<script type="application/json" id="phone-data">@@DATA@@</script>
<script>
const data = JSON.parse(document.getElementById("phone-data").textContent);
const form = document.querySelector("form");
const error = document.getElementById("error");
const csrf = {"X-CSRF-Token": data.csrf};
document.querySelectorAll(".equipment-card time").forEach(time => {
  const raw = time.dateTime;
  const value = new Date(/(?:Z|[+-]\d{2}:\d{2})$/.test(raw) ? raw : raw + "Z");
  if (!Number.isNaN(value.getTime())) time.textContent = value.toLocaleString();
});

async function post(url, body, headers = {}) {
  const response = await fetch(url, {method:"POST", body, headers:{...csrf, ...headers}});
  const result = await response.json();
  if (response.status === 401 && url !== "/q/login") {
    location.reload();
    throw new Error("Sign in again to continue");
  }
  if (!response.ok) {
    const detail = result.detail;
    throw new Error(typeof detail === "string" ? detail : Object.entries(detail || {}).map(([key, value]) =>
      typeof value === "string" ? (data.parameters?.find(p => p.key === key)?.label || key) + ": " + value : value.msg
    ).join("\n") || "Request failed");
  }
  return result;
}

function uuid() {
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  bytes[6] = (bytes[6] & 15) | 64;
  bytes[8] = (bytes[8] & 63) | 128;
  const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
  return [hex.slice(0,8),hex.slice(8,12),hex.slice(12,16),hex.slice(16,20),hex.slice(20)].join("-");
}

async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const scale = Math.min(1, 1600 / Math.max(image.width, image.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(image.width * scale));
    canvas.height = Math.max(1, Math.round(image.height * scale));
    canvas.getContext("2d", {alpha:false}).drawImage(image, 0, 0, canvas.width, canvas.height);
    let photo;
    for (const quality of [0.8,0.65,0.5,0.35]) {
      photo = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
      if (photo && photo.size <= 320000) break;
    }
    if (!photo) throw new Error("Could not encode image");
    return photo;
  } catch (_) {
    throw new Error("Could not read " + file.name + ". Choose a photo your browser can open.");
  } finally {
    URL.revokeObjectURL(url);
  }
}

function bindSubmit(handler) {
  form.addEventListener("submit", async event => {
    event.preventDefault();
    const button = form.querySelector("button[type=submit]");
    if (button.disabled) return;
    button.disabled = true;
    error.textContent = "";
    try { await handler(); }
    catch (failure) { error.textContent = failure.message; }
    finally { button.disabled = false; }
  });
}

if (data.screen === "login") {
  bindSubmit(async () => {
    await post("/q/login", JSON.stringify({
      username:form.username.value, password:form.password.value,
      keep_signed_in:form.keep_signed_in.checked
    }), {"Content-Type":"application/json"});
    location.reload();
  });
}

if (data.screen === "entry") {
  const entryId = uuid();
  if (data.open) {
    try { form.entered_by.value = localStorage.getItem("logentra-phone-name") || ""; } catch (_) {}
  } else {
    const logout = document.getElementById("signout");
    document.getElementById("operator").textContent = data.user;
    document.getElementById("session").hidden = false;
    logout.onclick = async () => {
      try { await post("/q/logout"); location.reload(); }
      catch (failure) { error.textContent = failure.message; }
    };
  }
  const inputs = [...form.querySelectorAll("[data-parameter]")];
  const save = form.querySelector("button[type=submit]");
  const warning = document.getElementById("reading-warning");
  function updateFlags() {
    const alerts = [];
    let count = 0, flagged = 0;
    for (const input of inputs) {
      const parameter = data.parameters[Number(input.dataset.parameter)];
      const flag = document.getElementById("flag-" + input.dataset.parameter);
      const value = Number(input.value.trim().replace(",", "."));
      const valid = Boolean(input.value.trim()) && Number.isFinite(value);
      const warn = valid && ((parameter.min !== "" && value < parameter.min)
        || (parameter.max !== "" && value > parameter.max));
      if (valid) count++;
      if (warn) {
        flagged++;
        const below = parameter.min !== "" && value < parameter.min;
        alerts.push(parameter.label + " " + value + (parameter.unit ? " " + parameter.unit : "") +
          (below ? " is below min " + parameter.min : " is above max " + parameter.max));
      }
      flag.textContent = valid ? (warn ? "Out of range" : "OK") : "";
      flag.toggleAttribute("data-warn", warn);
      input.closest(".reading-row").toggleAttribute("data-warn", warn);
    }
    const tableAlert = document.getElementById("table-alert");
    if (tableAlert) {
      tableAlert.hidden = !flagged;
      tableAlert.textContent = alerts.join(" · ");
    }
    save.textContent = count ? "Save " + count + (count === 1 ? " reading" : " readings") : "Save entry";
    warning.hidden = !flagged;
    warning.textContent = flagged + " out of range · " + (flagged === 1 ? "it will" : "they will") + " be flagged on the dashboard";
  }
  inputs.forEach(input => input.addEventListener("input", updateFlags));
  updateFlags();
  const picker = document.getElementById("photos");
  const addPhoto = document.getElementById("add-photo");
  const photoList = document.getElementById("photo-list");
  const photos = [];
  let replacing = null;
  function renderPhotos() {
    photoList.replaceChildren(...photos.map((photo, index) => {
      const item = document.createElement("figure");
      const image = document.createElement("img");
      image.src = photo.url;
      image.alt = photo.name;
      const size = document.createElement("figcaption");
      size.textContent = Math.max(1, Math.round(photo.blob.size / 1024)) + " KB";
      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "Remove";
      remove.setAttribute("aria-label", "Remove photo " + (index + 1));
      remove.onclick = () => { URL.revokeObjectURL(photo.url); photos.splice(index, 1); renderPhotos(); };
      const replace = document.createElement("button");
      replace.type = "button";
      replace.textContent = "Replace";
      replace.setAttribute("aria-label", "Replace photo " + (index + 1));
      replace.onclick = () => { replacing = index; picker.multiple = false; picker.click(); };
      item.append(image, size, remove, replace);
      return item;
    }));
    addPhoto.textContent = "Add photo (" + photos.length + " of " + data.photoLimit + ")";
    addPhoto.disabled = photos.length >= data.photoLimit;
  }
  addPhoto.onclick = () => { replacing = null; picker.multiple = true; picker.click(); };
  picker.onchange = async () => {
    const files = [...picker.files];
    picker.value = "";
    const index = replacing;
    if (!files.length) return;
    if (index === null && files.length + photos.length > data.photoLimit) {
      error.textContent = "Attach at most " + data.photoLimit + " photos";
      return;
    }
    save.disabled = addPhoto.disabled = true;
    photoList.inert = true;
    error.textContent = "";
    try {
      const processed = [];
      for (const file of files) {
        const blob = await shrink(file);
        processed.push({blob, name:file.name.replace(/\.[^.]+$/, "") + ".jpg"});
      }
      for (const photo of processed) photo.url = URL.createObjectURL(photo.blob);
      if (index === null) photos.push(...processed);
      else { URL.revokeObjectURL(photos[index].url); photos[index] = processed[0]; }
    } catch (failure) { error.textContent = failure.message; }
    finally { save.disabled = false; photoList.inert = false; renderPhotos(); }
  };
  bindSubmit(async () => {
    const body = new FormData();
    body.set("entry_id", entryId);
    body.set("note", form.note.value);
    if (data.open) {
      body.set("entered_by", form.entered_by.value);
      try { localStorage.setItem("logentra-phone-name", form.entered_by.value); } catch (_) {}
    }
    body.set("values", JSON.stringify(Object.fromEntries(inputs.map(input =>
      [data.parameters[Number(input.dataset.parameter)].key, input.value]))));
    for (const photo of photos) body.append("photos", photo.blob, photo.name);
    const saved = await post("/api/qr/" + data.code + "/entry", body);
    photos.forEach(photo => URL.revokeObjectURL(photo.url));
    form.hidden = true;
    document.getElementById("done").hidden = false;
    document.getElementById("saved-summary").textContent =
      saved.values.length + " readings · " + saved.values.filter(value => value.out_of_range).length +
      " out of range · " + saved.photos.length + " photos";
    const values = document.getElementById("saved-values");
    for (const savedValue of saved.values) {
      const parameter = data.parameters.find(item => item.key === savedValue.parameter);
      const item = document.createElement("li");
      item.textContent = (parameter?.label || savedValue.parameter) + " · " + savedValue.value +
        (parameter?.unit ? " " + parameter.unit : "") + (savedValue.out_of_range ? " · Out of range" : "");
      if (savedValue.out_of_range) item.className = "error";
      values.append(item);
    }
    const work = document.getElementById("work-form");
    if (work) {
      const raise = document.getElementById("raise-work");
      raise.onclick = () => { work.hidden = false; raise.hidden = true; work.elements.title.focus(); };
      work.elements.title.value = "Inspect " + data.tag;
      work.elements.description.value = saved.note;
      work.onsubmit = async event => {
        event.preventDefault();
        const button = work.querySelector("button[type=submit]");
        button.disabled = true;
        const feedback = document.getElementById("work-error");
        feedback.textContent = "";
        try {
          const order = await post("/api/qr/" + data.code + "/work-order",
            JSON.stringify({...Object.fromEntries(new FormData(work)), entry_id: saved.entry_id}),
            {"Content-Type":"application/json"});
          work.hidden = true;
          document.getElementById("work-result").textContent = "Work order created · " + order.title;
        } catch (failure) { feedback.textContent = failure.message; }
        finally { button.disabled = false; }
      };
    }
  });
}
</script>
</html>
