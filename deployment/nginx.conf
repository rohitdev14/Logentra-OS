worker_processes 2;
pid /run/logentra-nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
    access_log off;
    server_tokens off;
    # Generous per-client ceiling; the app itself limits failed sign-ins per client.
    limit_req_zone $binary_remote_addr zone=logentra_login:10m rate=30r/m;
    limit_req_status 429;

    map $http_host $logentra_host {
        default "";
        ~^(?<logentra_hostname>[A-Za-z0-9.-]+|\[[0-9A-Fa-f:.]+\])(?::[0-9]+)?$ $logentra_hostname;
    }

    # Literal map keys are case-insensitive. Prefix keys to avoid map keywords.
    map "host:$logentra_host" $logentra_allowed_host {
        default 0;
        __LOGENTRA_ALLOWED_HOSTS__
    }

    upstream logentra_app {
        server 127.0.0.1:8787;
        keepalive 32;
    }

    server {
        listen 443 ssl default_server;
        server_name _;
        # Match the configured hostname before forwarding the original port.
        if ($logentra_allowed_host = 0) { return 444; }
        ssl_certificate /etc/logentra/tls/fullchain.pem;
        ssl_certificate_key /etc/logentra/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 30m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        location = /api/auth/login {
            limit_req zone=logentra_login burst=10 nodelay;
            proxy_pass http://logentra_app;
        }

        location = /api/auth/login/ {
            limit_req zone=logentra_login burst=10 nodelay;
            proxy_pass http://logentra_app;
        }

        location ~ ^/q/login/?$ {
            limit_req zone=logentra_login burst=10 nodelay;
            proxy_pass http://logentra_app;
        }

        location / {
            proxy_pass http://logentra_app;
        }

        error_page 429 = @login_throttled;
        location @login_throttled {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header Cache-Control no-store always;
            return 429 '{"detail":"Too many sign-in attempts. Please wait 60 seconds and try again."}';
        }
    }
}
