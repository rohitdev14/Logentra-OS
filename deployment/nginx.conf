worker_processes 2;
pid /run/logentra-nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
    access_log off;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=logentra_login:10m rate=10r/m;
    limit_req_status 429;

    upstream logentra_app {
        server 127.0.0.1:8787;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        server_name logentra.example.com;
        ssl_certificate /etc/logentra/tls/fullchain.pem;
        ssl_certificate_key /etc/logentra/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 30m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        location = /api/auth/login {
            limit_req zone=logentra_login burst=5 nodelay;
            proxy_pass http://logentra_app;
        }

        location = /api/auth/login/ {
            limit_req zone=logentra_login burst=5 nodelay;
            proxy_pass http://logentra_app;
        }

        location / {
            proxy_pass http://logentra_app;
        }
    }
}
