[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logentra-os"
version = "0.5.0"
description = "Open-source logbook, engineering records & traceability for industrial plants"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Logentra OS contributors" }]
keywords = ["logbook", "engineering", "traceability", "CMMS", "industrial", "on-prem"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.9",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "python-multipart==0.0.34",
  "httpx==0.28.1",
  "paho-mqtt==2.2.0",
  "PyYAML==6.0.4",
  "openpyxl==3.1.5",
  "python-dotenv==1.2.4",
  "alembic==1.16.5",
]

[project.urls]
Homepage = "https://github.com/YOUR-USER/logentra-os"
Documentation = "https://github.com/YOUR-USER/logentra-os#readme"


[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
include = ["logentra_server*", "logbook_server*"]
