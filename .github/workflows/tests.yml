name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logentra
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: logentra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logentra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOGENTRA_TEST_POSTGRES: postgresql+psycopg://logentra:ci-test-only@127.0.0.1:5432/logentra_test
      LOGENTRA_TEST_POSTGRES_RESTORE: postgresql+psycopg://logentra:ci-test-only@127.0.0.1:5432/logentra_restore
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-postgres.txt
      - name: Set up Chromium and restore database
        run: |
          python -m playwright install --with-deps chromium
          python -c 'import os, psycopg; dsn = os.environ["LOGENTRA_TEST_POSTGRES"].replace("+psycopg", ""); db = psycopg.connect(dsn, autocommit=True); db.execute("CREATE DATABASE logentra_restore")'
          pg_dump --version
      - name: Run complete test suite
        run: python -m pytest -q --cov=logentra_server --cov-report=term-missing --cov-report=xml --cov-fail-under=82
      - name: Check Python and generated browser bundles
        run: |
          ruff check --select F401,F821,F822,F823 logentra_server scripts tests
          python ui/build.py
          git diff --exit-code -- ui/Logentra.html ui/Logbook.html ui/index.html
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m venv resolved
          resolved/bin/pip install -r requirements-postgres.txt
          resolved/bin/pip freeze > resolved.txt
          pip install pip-audit==2.10.1
          pip-audit --no-deps --disable-pip -r resolved.txt
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Record Ruff baseline
        continue-on-error: true
        shell: bash
        run: ruff check --select F,E9,B,S logentra_server scripts 2>&1 | tee ruff-security.txt
      - name: Upload Ruff baseline
        uses: actions/upload-artifact@v7
        with:
          name: ruff-security
          path: ruff-security.txt
      - name: Run Bandit
        run: bandit -r logentra_server logbook_server -ll
      - name: Scan for secrets
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1"
  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify SQLite image startup and non-root UID
        run: |
          docker compose build app
          docker compose up -d --wait app
          test "$(docker compose exec -T app id -u)" = 10001
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/bootstrap)" = 401
      - name: Back up and restore through the recovery service without extra privileges
        run: |
          token=$(docker compose exec -T app python run.py create-admin --username ci-admin --password ci-admin-pass >/dev/null && \
            curl -s -X POST -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"ci-admin-pass"}' \
            http://127.0.0.1:8787/api/auth/login | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl --fail --silent -X POST -H "Authorization: Bearer $token" http://127.0.0.1:8787/api/demo >/dev/null
          printf 'restore round trip' > evidence.txt
          did=$(curl -s -H "Authorization: Bearer $token" -F file=@evidence.txt -F title=CI \
            http://127.0.0.1:8787/api/documents | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          code=$(curl --fail --silent -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"ids":["eq_p101"]}' http://127.0.0.1:8787/api/equipment/qr-codes | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["codes"]["eq_p101"])')
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFklEQVR4nGPkCatlYGBgYmBgYGBgAAAKLQDjwA+xCwAAAABJRU5ErkJggg==' | base64 -d > reading.png
          entry_id=$(python3 -c 'import uuid; print(uuid.uuid4())')
          photo=$(curl --fail --silent -H "Authorization: Bearer $token" \
            -F "entry_id=$entry_id" -F 'note=Cooling pump inspection' -F photos=@reading.png \
            "http://127.0.0.1:8787/api/qr/$code/entry" | python3 -c 'import json,sys; print(json.load(sys.stdin)["photos"][0])')
          reading_payload='{"tag":"P-101","parameter":"flow","value":52,"quality":"uncertain","idempotency_key":"ci-restore-reading"}'
          reading_id=$(curl --fail --silent -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "$reading_payload" http://127.0.0.1:8787/api/readings | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["reading"]["id"])')
          docker compose stop app
          docker compose --profile recovery run --rm recovery backup /backups/ci
          docker compose --profile recovery run --rm recovery restore /backups/ci --replace
          docker compose start app
          docker compose up -d --wait app
          test "$(curl -s -H "Authorization: Bearer $token" http://127.0.0.1:8787/api/documents/$did/file)" = "restore round trip"
          curl --fail --silent -H "Authorization: Bearer $token" "http://127.0.0.1:8787/api/readings/photos/$photo" > restored-reading.png
          cmp reading.png restored-reading.png
          status=$(curl --fail --silent -o restored-reading.json -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -d "$reading_payload" http://127.0.0.1:8787/api/readings)
          test "$status" = 200
          python3 - "$reading_id" <<'PY'
          import json
          import sys

          with open("restored-reading.json", encoding="utf-8") as handle:
              result = json.load(handle)
          reading = result["reading"]
          assert result["duplicate"] and result["added"] == 0
          assert (reading["id"], reading["unit"], reading["quality"], reading["source"], reading["idempotency_key"]) == (
              sys.argv[1], "m³/h", "uncertain", "api", "ci-restore-reading",
          )
          PY
      - name: Verify PostgreSQL profile startup
        env:
          LOGENTRA_POSTGRES_PASSWORD: ci-test-only
          LOGENTRA_DATABASE_URL: postgresql+psycopg://logentra:ci-test-only@postgres:5432/logentra
        run: |
          docker compose stop app
          docker compose --profile postgres up -d --wait postgres
          docker compose up -d --wait app
          curl --fail http://127.0.0.1:8787/api/ready
      - name: Scan the built app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: logentra-os:local
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
      - name: Shut down test containers
        if: always()
        run: docker compose --profile postgres down -v
