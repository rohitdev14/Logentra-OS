# Copy this file to config.yaml (same folder as run.py) or set LOGENTRA_* environment variables
# (deprecated LOGBOOK_* names are still accepted).

host: 127.0.0.1
port: 8787
open_browser: true

# SQLite is the default — a single file, zero setup.
database_url: sqlite:///data/logentra.db

# To use PostgreSQL instead, install psycopg and point at your server:
#   pip install "psycopg[binary]"
# database_url: postgresql+psycopg://logentra:logentra@127.0.0.1:5432/logentra

# Auth mode:
#   open  — single-user / standalone (default). No login. Optional api_key still works.
#   users — require a session token (POST /api/auth/login) or a user-bound API key.
auth_mode: open
session_days: 7
# First admin, used only when auth_mode is users and the users table is empty:
# bootstrap_admin_username: admin
# bootstrap_admin_password: "choose-a-strong-password"
# Or run:  python run.py create-admin --username admin --password '...'

# Optional legacy / global API key. When set in open mode, every /api route except
# /api/health requires  X-API-Key: <key>  or  Authorization: Bearer <key>.
# In users mode it is also accepted as an admin credential.
api_key: ""

# Optional MQTT subscriber. Leave enabled: false if you have no broker.
mqtt:
  enabled: false
  host: 127.0.0.1
  port: 1883
  username: ""
  password: ""
  client_id: logentra
  topics:
    - logentra/readings
    - logentra/+/+
    - logbook/readings      # deprecated alias, still accepted
    - logbook/+/+
  # When a message arrives on logentra/{tag}/{parameter} (or the older logbook/… pattern),
  # tag and parameter are taken from the topic if the JSON body does not include them.
  topic_pattern: logentra/{tag}/{parameter}

# Optional outbound webhooks registered at first start (you can also POST /api/webhooks).
# outbound_webhooks:
#   - url: http://127.0.0.1:9000/hook
#     events: [out_of_range]
#     secret: ""
