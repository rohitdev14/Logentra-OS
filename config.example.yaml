# Copy this file to config.yaml (same folder as run.py) or set LOGBOOK_* environment variables.

host: 127.0.0.1
port: 8787
open_browser: true

# SQLite is the default — a single file, zero setup.
database_url: sqlite:///data/logbook.db

# To use PostgreSQL instead, install psycopg and point at your server:
#   pip install "psycopg[binary]"
# database_url: postgresql+psycopg://logbook:logbook@127.0.0.1:5432/logbook

# Optional API key. When set, every /api route except /api/health requires
# the header  X-API-Key: <key>  or  Authorization: Bearer <key>.
# Leave empty for a trusted local machine.
api_key: ""

# Optional MQTT subscriber. Leave enabled: false if you have no broker.
mqtt:
  enabled: false
  host: 127.0.0.1
  port: 1883
  username: ""
  password: ""
  client_id: logbook-v3
  topics:
    - logbook/readings
    - logbook/+/+
  # When a message arrives on logbook/{tag}/{parameter}, tag and parameter
  # are taken from the topic if the JSON body does not include them.
  topic_pattern: logbook/{tag}/{parameter}

# Optional outbound webhooks registered at first start (you can also POST /api/webhooks).
# outbound_webhooks:
#   - url: http://127.0.0.1:9000/hook
#     events: [out_of_range]
#     secret: ""
