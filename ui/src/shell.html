<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>__PRODUCT_NAME__ __RELEASE_LABEL__ — __PRODUCT_TAGLINE__</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("logentra.theme") || localStorage.getItem("logbook.theme");
        if (t !== "light" && t !== "dark") {
          t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <style>
__CSS__
  </style>
</head>
<body>
  <div id="login-gate" class="login-gate" hidden>
    <div class="login-card card">
      <div class="brand" style="margin-bottom:1rem">
        <div class="brand-mark" aria-hidden="true"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v14H5z"/><path d="M5 10h14M10 5v14"/></svg></div>
        <div>
          <h1 id="login-product">__PRODUCT_NAME__</h1>
          <div class="sub">Sign in to continue</div>
        </div>
      </div>
      <form id="login-form" autocomplete="on">
        <label class="fld"><span>Username</span><input type="text" id="login-user" name="username" required autofocus></label>
        <label class="fld"><span>Password</span><input type="password" id="login-pass" name="password" required></label>
        <p id="login-error" class="form-error" hidden></p>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.6rem">Sign in</button>
      </form>
      <p class="tiny" style="margin-top:1rem">On-prem __RELEASE_LABEL__. Create the first admin with <code>python run.py create-admin</code>.</p>
    </div>
  </div>
  <div class="app" id="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v14H5z"/><path d="M5 10h14M10 5v14"/></svg></div>
        <div>
          <h1 data-product-name>__PRODUCT_NAME__</h1>
          <div class="sub">__RELEASE_LABEL__</div>
        </div>
      </div>
      <div class="nav-label">Operations</div>
      <nav class="nav" aria-label="Main">
        <button type="button" data-view="dashboard"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span class="lbl">Dashboard</span></button>
        <button type="button" data-view="equipment"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg><span class="lbl">Equipment</span></button>
        <button type="button" data-view="workorders"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg><span class="lbl">Work orders</span><span class="count" id="nav-wo-count" hidden></span></button>
        <button type="button" data-view="approvals" data-need-perm="documents.read"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m9 15 2 2 4-4"/></svg><span class="lbl">Approvals</span><span class="count" id="nav-appr-count" hidden></span></button>
        <button type="button" data-view="trends"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span class="lbl">Trends</span></button>
        <button type="button" data-view="logbook"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span class="lbl">Logs</span></button>
        <button type="button" data-view="records"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg><span class="lbl">Records</span></button>
      </nav>
      <div class="nav-label">Admin</div>
      <nav class="nav" aria-label="Admin">
        <button type="button" data-view="templates"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg><span class="lbl">Templates</span></button>
        <button type="button" data-view="users" data-need-perm="users.manage"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="lbl">Users &amp; roles</span></button>
        <button type="button" data-view="routes" data-need-perm="routes.manage"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m9 15 2 2 4-4"/></svg><span class="lbl">Approval routes</span></button>
        <button type="button" data-view="import"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg><span class="lbl">Import</span></button>
        <button type="button" data-view="backup"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg><span class="lbl">Backup</span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="avatar a-mc" id="who-avatar">•</div>
        <div class="who grow">
          <div class="name" id="who-name">Local user</div>
          <div class="role" id="who-role">Open mode</div>
        </div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="search">
          <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="global-search" type="search" placeholder="Search tags, work orders, documents" aria-label="Search">
          <span class="kbd">/</span>
        </div>
        <div class="topbar-right">
          <div class="site-chip" id="site-chip">Local site</div>
          <span id="api-badge" class="api-badge">Connecting…</span>
          <a class="docs-link" href="/docs" target="_blank" rel="noopener">API docs</a>
          <span id="user-chip" class="user-chip" hidden></span>
          <button type="button" id="theme-toggle" class="theme-toggle" title="Toggle light / dark theme" aria-label="Toggle theme">
            <svg class="icon icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
            <svg class="icon icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
          <button type="button" id="logout-btn" class="btn btn-sm" hidden>Sign out</button>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <script>
window.LOGENTRA_PRODUCT = { name: "__PRODUCT_NAME__", short: "__PRODUCT_SHORT__", initials: "__PRODUCT_INITIALS__", version: "__APP_VERSION__", label: "__RELEASE_LABEL__", tagline: "__PRODUCT_TAGLINE__" };
window.LOGBOOK_PRODUCT = window.LOGENTRA_PRODUCT;
__THEME__
__XLSX__
__PACKS__
__API__
__JS__
__V4__
__V5__
  </script>
</body>
</html>
