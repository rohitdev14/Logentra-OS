  function modalAnnot(logId, paramKey) {
    const log = state.logs.find((l) => l.id === logId);
    if (!log) { toast("Log entry not found."); return; }
    const eq = eqById(log.equipmentId);
    const param = (eq ? paramsFor(eq) : []).find((p) => p.key === paramKey) || { key: paramKey, label: paramKey, unit: "" };
    const existing = annotOf(log, paramKey) || {};
    const val = log.readings ? log.readings[paramKey] : "";
    const bad = outOfRange(num(val), param);
    const when = existing.at || nowDateTime();
    const box = openModal(`
      <h2>${annotFilled(existing) ? "Edit annotation" : "Add annotation"}</h2>
      <p class="tiny">${esc(eq ? eqTag(eq) : "")} · ${esc(param.label)}${param.unit ? " (" + esc(param.unit) + ")" : ""} · ${esc(log.date)} ${esc(log.time || "")} · value ${esc(val)}${bad ? ' <span class="pill pill-fail">Out of range</span>' : ""}</p>
      <div class="stack" style="margin-top:.7rem">
        <label class="fld"><span>Cause</span><textarea id="a-cause" placeholder="What happened?">${esc(existing.cause || "")}</textarea></label>
        <label class="fld"><span>Action taken</span><textarea id="a-action" placeholder="What was done?">${esc(existing.action || "")}</textarea></label>
        <div class="form-grid">
          <label class="fld"><span>Initials / name</span><input id="a-by" value="${esc(existing.by || "")}"></label>
          <label class="fld"><span>Timestamp</span><input id="a-at" type="datetime-local" value="${esc(when)}"></label>
        </div>
        <div class="row spread">
          ${annotFilled(existing) ? '<button class="btn btn-danger" id="a-del">Delete note</button>' : '<button class="btn" data-close="1">Cancel</button>'}
          <div class="row">
            ${annotFilled(existing) ? '<button class="btn" data-close="1">Cancel</button>' : ""}
            <button class="btn btn-primary" id="a-save">Save</button>
          </div>
        </div>
      </div>
    `);
    box.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeModal));
    box.querySelector("#a-save").addEventListener("click", () => {
      const rec = {
        cause: document.getElementById("a-cause").value.trim(),
        action: document.getElementById("a-action").value.trim(),
        by: document.getElementById("a-by").value.trim(),
        at: document.getElementById("a-at").value || nowDateTime()
      };
      if (!annotFilled(rec)) { toast("Enter a cause, action, or name."); return; }
      if (!log.annotations) log.annotations = {};
      log.annotations[paramKey] = rec;
      const done = () => { closeModal(); render(); toast("Annotation saved."); };
      if (window.LogbookAPI) {
        window.LogbookAPI.putAnnotation(log.id, paramKey, rec).then(done).catch((err) => toast("Save failed: " + err.message));
      } else { persist(); done(); }
    });
    const del = box.querySelector("#a-del");
    if (del) del.addEventListener("click", () => {
      if (!confirm("Delete this annotation?")) return;
      if (log.annotations) delete log.annotations[paramKey];
      const done = () => { closeModal(); render(); toast("Annotation deleted."); };
      if (window.LogbookAPI) {
        window.LogbookAPI.deleteAnnotation(log.id, paramKey).then(done).catch((err) => toast("Delete failed: " + err.message));
      } else { persist(); done(); }
    });
  }

  /* ---------- bind + events ---------- */
  function bindView() {
    if (ui.view === "recordEdit") {
      const audit = document.getElementById("record-audit");
      const record = state.records.find(row => row.id === ui.recordId);
      if (audit && record) loadRecordAudit(audit, record);
    }
    if (ui.view === "trends") {
      const el = document.getElementById("chart");
      const eq = eqById(ui.logEq || (state.equipment[0] && state.equipment[0].id));
      const params = eq ? paramsFor(eq) : [];
      const paramKey = ui.trendParam || (params[0] && params[0].key);
      const param = params.find((p) => p.key === paramKey);
      const from = (document.getElementById("tr-from") || {}).value || ui.from;
      const to = (document.getElementById("tr-to") || {}).value || ui.to;
      if (el && eq && param) {
        drawTrend(el, trendPoints(eq, param, from, to), param);
        el.querySelectorAll("[data-log-id]").forEach((g) => {
          g.addEventListener("click", () => modalAnnot(g.dataset.logId, g.dataset.param));
          g.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); modalAnnot(g.dataset.logId, g.dataset.param); }
          });
        });
      }
    }
    if (ui.view === "import") {
      const drop = document.getElementById("im-drop");
      const file = document.getElementById("im-file");
      if (drop && file) {
        ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
        ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
        drop.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f) handleImportFile(f); });
      }
    }
  }

  async function handleImportFile(file) {
    try {
      const kind = (document.getElementById("im-kind") || {}).value || (ui.import && ui.import.kind) || "equipment";
      const logMode = (document.getElementById("im-mode") || {}).value || "long";
      const parsed = await tableFromFile(file);
      const sheet = parsed.sheets[0];
      const mapping = autoMap(sheet.rows[0] || [], importTargets(kind, logMode));
      // wide mode: auto-map leftover numeric-looking headers as new params if no match
      if (kind === "logs" && logMode === "wide") {
        (sheet.rows[0] || []).forEach((h, i) => {
          if (!mapping[i] && h) mapping[i] = "pnew:";
        });
      }
      ui.import = {
        step: 2, kind, logMode, fileName: parsed.fileName, sheets: parsed.sheets,
        sheetName: sheet.name, rows: sheet.rows, mapping, createMissing: true,
        templateId: ui.templateId || "__new__", newTemplateName: "Imported template"
      };
      render();
    } catch (err) {
      toast("Could not read file: " + err.message);
    }
  }

  function confirmDemo() {
    if (state.equipment.length && !state.meta.demo) {
      return confirm("Load fictional demo data? This replaces what is currently stored in the database. Export a JSON backup first if you need it.");
    }
    if (state.equipment.length) return confirm("Reload the fictional demo? Current database data will be replaced.");
    return true;
  }

  document.body.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;
    if (window.LogbookV4 && window.LogbookV4.handleAction) {
      const maybe = window.LogbookV4.handleAction(act, btn, e);
      if (maybe && typeof maybe.then === "function") {
        maybe.then((handled) => { if (handled) e.preventDefault(); });
        e.preventDefault();
        return;
      } else if (maybe) {

  function runImport() {

      let text = "";

        const r = applyEquipmentImport(wiz.rows, wiz.mapping, wiz.createMissing);
        text = "Added " + r.added + ", updated " + r.updated + ", skipped " + r.skipped + " (missing tag).";
      } else if (wiz.kind === "template") {
        const r = applyTemplateImport(wiz.rows, wiz.mapping, wiz.templateId, wiz.newTemplateName);
        text = "Added " + r.added + " items to “" + r.templateName + "”.";
      } else {
        const r = applyLogsImport(wiz.rows, wiz.mapping, wiz.logMode);
        text = "Imported " + r.added + " log group(s). Skipped " + r.skipped + " (unknown tag or empty).";

      const finish = () => { wiz.step = 3; wiz.resultText = text; render(); toast(text); };

        // Re-read recent imported rows from state: last `added` groups

/* v0.4 screens: login gate, work orders, users/roles, permission-aware chrome. */
(function (global) {
  "use strict";

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function product() {
    const p = global.LOGENTRA_PRODUCT || global.LOGBOOK_PRODUCT || {};
    return p.name || "Logentra OS";
  }
  function can(perm) {
    const L = global.Logbook;
    const state = L && L.getState && L.getState();
    const me = state && state.me;
    if (!me || me.mode === "open" || me.mode === "legacy_key") return true;
    return (me.permissions || []).indexOf(perm) >= 0;
  }

  function applyChrome() {
    const L = global.Logbook;
    const state = L && L.getState && L.getState();
    const me = state && state.me;
    const authMode = (state && state.auth_mode) || (me && me.mode) || "open";
    document.querySelectorAll("[data-need-perm]").forEach((el) => {
      const need = el.getAttribute("data-need-perm");
      const ok = !need || need.split(/\s+/).every((p) => can(p));
      el.hidden = !ok;
      if (el.tagName === "BUTTON" || el.tagName === "A") {
        el.style.display = ok ? "" : "none";
      }
    });
    document.querySelectorAll("[data-need-any]").forEach((el) => {
      const need = el.getAttribute("data-need-any").split(/\s+/);
      const ok = need.some((p) => can(p));
      el.style.display = ok ? "" : "none";
    });
    const chip = document.getElementById("user-chip");
    const out = document.getElementById("logout-btn");
    if (chip) {
      if (me && me.mode === "user") {
        chip.hidden = false;
        chip.textContent = (me.username || "user") + " · " + (me.role || "");
      } else {
        chip.hidden = true;
      }
    }
    if (out) out.hidden = !(authMode === "users" && me && me.mode === "user");
    const nameEl = document.getElementById("who-name");
    const roleEl = document.getElementById("who-role");
    const av = document.getElementById("who-avatar");
    if (me && me.mode === "user") {
      const label = me.display_name || me.username || "user";
      if (nameEl) nameEl.textContent = label;
      if (roleEl) roleEl.textContent = (me.role || "user");
      if (av) {
        const parts = String(label).trim().split(/\s+/);
        av.textContent = ((parts[0] || "?")[0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
      }
    } else {
      if (nameEl) nameEl.textContent = (me && me.username) || "Local user";
      if (roleEl) roleEl.textContent = (authMode === "open") ? "Open mode" : (me && me.role) || "";
      if (av) av.textContent = (global.LOGENTRA_PRODUCT && global.LOGENTRA_PRODUCT.initials) || "LO";
    }
    const site = document.getElementById("site-chip");
    if (site && state) site.textContent = plantLabel(state);

  function plantLabel(state) {
    const locs = (state.equipment || []).map((e) => {
      const v = e.values || {};
      return v.fld_location || v.location || "";
    }).filter(Boolean);
    for (const loc of locs) {
      const parts = String(loc).split(/\s+[—–-]\s+/);
      if (parts.length > 1) return parts[parts.length - 1].trim();
    }
    return locs[0] || "All sites";

    const api = global.LogbookAPI;
    if (!api) return true;
    let health;
    try { health = await api.health(); } catch (e) { return true; }
    if (!health || health.auth_mode !== "users") return true;
    if (api.getToken()) {
      try {
        await api.me();
        hideLogin();
        return true;
      } catch (e) {
        api.setToken("");
      }
    }
    showLogin();
    return false;
  }

  /* Too many attempts: say how long to wait and re-enable Sign in when it is over. */
  function throttleLogin(form, err, seconds) {
    const button = form.querySelector('button[type="submit"]');
    let left = Math.max(1, Math.min(600, Math.round(seconds)));
    clearInterval(form._throttle);
    const tick = () => {
      if (err) {
        err.hidden = false;
        err.textContent = "Too many sign-in attempts. Please wait " + left + (left === 1 ? " second" : " seconds") + " and try again.";
      }
      if (button) button.disabled = true;
      if (left <= 0) {
        clearInterval(form._throttle);
        if (button) button.disabled = false;
        if (err) { err.textContent = "You can try signing in again now."; }
        return;
      }
      left -= 1;
    };
    tick();
    form._throttle = setInterval(tick, 1000);
  }

  function bindLogin() {
    const form = document.getElementById("login-form");
    if (!form || form._bound) return;
    form._bound = true;
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const user = document.getElementById("login-user").value;
      const pass = document.getElementById("login-pass").value;
      const err = document.getElementById("login-error");
      try {
        const result = await global.LogbookAPI.login(user, pass);
        if (global.Logbook) {
          await global.Logbook.resumeAfterLogin(result.user);
          global.Logbook.render();
        }
        document.getElementById("login-pass").value = "";
        hideLogin();
      } catch (e) {
        if (e && e.status === 429) {
          throttleLogin(form, err, e.retryAfter || 60);
        } else if (err) {
          err.hidden = false;
          err.textContent = e.message || "Sign-in failed";
        }
      }
    });
    const out = document.getElementById("logout-btn");
    if (out && !out._bound) {
      out._bound = true;
      out.addEventListener("click", async () => {
        try { await global.LogbookAPI.logout(); } catch (e) {}
        showLogin("Signed out.");
      });
    }
    global.addEventListener("logbook:auth-required", () => {
      if (global.LogbookAPI) global.LogbookAPI.setToken("");
      showLogin("Your session expired. Please sign in again.");
    });
  }

  function initials(name) {
    const parts = String(name || "").trim().split(/\s+/);
    return ((parts[0] || "?")[0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  function formatDue(due) {
    if (!due) return { text: "No due date", cls: "" };
    const raw = String(due);
    const day = raw.slice(0, 10);
    const today = new Date();
    const z = (n) => String(n).padStart(2, "0");
    const tiso = today.getFullYear() + "-" + z(today.getMonth() + 1) + "-" + z(today.getDate());
    const yest = new Date(today); yest.setDate(yest.getDate() - 1);
    const yiso = yest.getFullYear() + "-" + z(yest.getMonth() + 1) + "-" + z(yest.getDate());
    let text = day;
    if (day === tiso) {
      text = raw.length > 10 ? "Today " + raw.slice(11, 16) : "Today";
    } else if (day === yiso) text = "Yesterday";
    else {
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const [Y,M,D] = day.split("-");
      text = (D ? parseInt(D, 10) : "") + " " + (months[parseInt(M, 10) - 1] || "");
    }
    const overdue = day && day < tiso;
    return { text: text, cls: overdue ? "late" : (day === tiso ? "soon" : "") };
  }
  function woCard(w) {
    const prio = w.priority || "medium";

    const tag = w.tag || "—";
    const closed = w.status === "closed" || w.status === "done";
    const dueLabel = closed ? ("Closed " + (w.closed_at || w.completed_at || w.due_at || "").slice(5, 10)) : due.text;
    const dueCls = closed ? "" : due.cls;
    return '<article class="wocard" data-act="wo-open" data-id="' + esc(w.id) + '">' +
      '<div class="row spread" style="margin-bottom:6px"><span class="pill ' + esc(prio) + '">' + esc(prio[0].toUpperCase() + prio.slice(1)) + '</span>' +

      '<span class="due ' + dueCls + '">' + esc(dueLabel) + '</span></div></article>';
  }

      const t = new Date();

    return `

  /* ---------- actions ---------- */
  function toast(msg) {
    if (global.Logbook && global.Logbook._toast) return global.Logbook._toast(msg);
    console.log(msg);
  }

  const V4_ACTS = new Set([
    "wo-new","wo-open","wo-page","wo-create","wo-save","wo-comment","wo-labour","wo-attach","wo-rules",
    "wor-create","wor-toggle","wor-del","usr-create","usr-del","usr-key","role-create",
  ]);

  function handleAction(act, el, ev) {
    if (!V4_ACTS.has(act)) return false;
    return handleActionAsync(act, el, ev);
  }

  async function handleActionAsync(act, el, ev) {
    const api = global.LogbookAPI;
    const L = global.Logbook;
    const ui = L._ui || (L._ui = {});
    try {
      if (act === "wo-new") { ui.view = "woNew"; if (cache.users.length === 0) await refreshUsers(); L.render(); return true; }
      if (act === "wo-open") {
        cache.detail = await api.getWorkOrder(el.dataset.id);
        if (cache.users.length === 0) await refreshUsers();
        ui.view = "woDetail";
        L.render();
        return true;
      }
      if (act === "wo-page") {
        ui.woPage = Number(el.dataset.page || 1);
        await loadWorkOrderList(ui);
        L.render();
        return true;
      }
      if (act === "wo-create") {
        const body = {
          title: document.getElementById("wo-n-title").value,
          description: document.getElementById("wo-n-desc").value,
          priority: document.getElementById("wo-n-prio").value,
          due_at: document.getElementById("wo-n-due").value || null,
          equipment_id: document.getElementById("wo-n-eq").value || null,
          assignee_id: document.getElementById("wo-n-assignee").value || null,
        };
        const created = await api.createWorkOrder(body);
        cache.detail = created;
        ui.view = "woDetail";
        L.render();
        return true;
      }
      if (act === "wo-save") {
        const w = cache.detail;
        const body = {
          title: w.title,
          description: document.getElementById("wo-d-desc").value,
          priority: document.getElementById("wo-d-prio").value,

  function routeForm(route) {
    const steps = (route && route.steps) || [{ assignee_type: "role", role_name: "supervisor", label: "Supervisor" }, { assignee_type: "role", role_name: "admin", label: "Admin" }];

  }

  function parseSteps(text) {
    return String(text || "").split("\\n").map((line) => line.trim()).filter(Boolean).map((line, i) => {
      const parts = line.split(",").map((x) => x.trim());
      const type = (parts[0] || "role").toLowerCase() === "user" ? "user" : "role";
      const step = { sort_order: i, assignee_type: type, label: parts[2] || "" };
      if (type === "user") step.user_id = parts[1];
      else step.role_name = parts[1];
      return step;
    });
  }

  async function collectAndSaveRoute(id) {
    const body = {
      name: document.getElementById("rt-name").value,

      enabled: document.getElementById("rt-enabled").checked,
      steps: parseSteps(document.getElementById("rt-steps").value),
    };
    if (id) await global.LogbookAPI.patchRoute(id, body);
    else await global.LogbookAPI.createRoute(body);
  }

  async function doSubmitNew() {
    const fileEl = document.getElementById("sub-file");
    const file = fileEl && fileEl.files && fileEl.files[0];
    if (!file) { toast("Choose a file to upload."); return; }
    const form = new FormData();

    form.append("title", (document.getElementById("sub-title") || {}).value || file.name);

    form.append("equipment_id", (document.getElementById("sub-eq") || {}).value || "");
    form.append("work_order_id", (document.getElementById("sub-wo") || {}).value || "");
    form.append("route_id", (document.getElementById("sub-route") || {}).value || "");
    form.append("submit", "true");
    const doc = await global.LogbookAPI.uploadDocument(form);
    toast("Submitted for approval.");
    const L = global.Logbook;
    cache.detail = doc;
    L.goto("approvalDetail", { docId: doc.id });
  }

  async function doSubmitExisting(id) {
    const fileEl = document.getElementById("sub-file");
    const file = fileEl && fileEl.files && fileEl.files[0];
    const api = global.LogbookAPI;
    if (file) {
      const form = new FormData();
      form.append("file", file);
      await api.addDocumentVersion(id, form);
    }
    const patch = {
      title: (document.getElementById("sub-title") || {}).value,
      document_type: (document.getElementById("sub-type") || {}).value,
      equipment_id: (document.getElementById("sub-eq") || {}).value || null,
      work_order_id: (document.getElementById("sub-wo") || {}).value || null,
    };
    try { await api.patchDocument(id, patch); } catch (e) { /* may already be submitted */ }
    const doc = await api.submitDocument(id, { route_id: (document.getElementById("sub-route") || {}).value || null });
    toast("Submitted for approval.");
    cache.detail = doc;
    global.Logbook.goto("approvalDetail", { docId: doc.id });
  }

  async function commentRequired(action, options) {
    if (options) {
      const approve = action === "approve";
      const dialog = document.createElement("dialog");
      const label = approve ? "Approve record" : "Return for changes";
      dialog.className = "shift-dialog";
      dialog.innerHTML = `<form method="dialog" class="stack">
        <h3>${label}</h3>
        ${options.punches?.length ? `<div class="shift-banner">
          <strong>Open punches</strong><ul>${options.punches.map(punch => `<li>${esc(punch.description)}</li>`).join("")}</ul></div>` : ""}
        <label class="fld"><span>${approve ? "Comment (optional)" : "Comment (required)"}</span>
          <textarea name="comment" maxlength="10000" ${approve ? "" : "required"}></textarea>
        </label><div class="row">
          <button class="btn" value="cancel" formnovalidate>Cancel</button>
          <button class="btn btn-primary ${approve ? "success" : "warn"}" value="save">${approve ? "Approve" : "Return"}</button>
        </div></form>`;
      const input = dialog.querySelector("textarea");
      dialog.querySelector("form").onsubmit = event => {
        if (!approve && event.submitter?.value === "save" && !input.value.trim()) {
          event.preventDefault();
          input.setCustomValidity("A comment is required.");
          input.reportValidity();
        }
      };
      input.oninput = () => input.setCustomValidity("");
      document.body.append(dialog);
      return new Promise(resolve => {
        dialog.addEventListener("close", () => {
          const result = dialog.returnValue === "save" ? input.value.trim() : null;
          dialog.remove();
          resolve(result);
        }, {once: true});
        dialog.showModal();
      });
    }
    const existing = (document.getElementById("doc-comment") || {}).value;
    if (action === "approve") return existing || "";
    const text = existing || prompt(action === "reject" ? "Rejection comment (required)" : "Describe the changes required");
    if (!text || !String(text).trim()) {
      toast("A comment is required.");
      return null;
    }
    return String(text).trim();
  }

  const ACTS = new Set(["doc-open","doc-new","doc-submit-new","doc-submit-existing","doc-approve","doc-reject","doc-return","doc-comment","rt-new","rt-edit","rt-del"]);

  async function handleAction(act, el, ev) {
    if (!ACTS.has(act)) return false;
    const L = global.Logbook;
    const api = global.LogbookAPI;
    const ui = L._ui || (L._ui = {});
    try {
      if (act === "doc-open") {
        ui.docId = el.dataset.id;
        await loadDetail(ui.docId);
        L.goto("approvalDetail", { docId: ui.docId });
        return true;
      }
      if (act === "doc-new") {
        if (!cache.routes) cache.routes = await api.listRoutes();
        L.goto("docSubmit");
        return true;
      }
      if (act === "doc-submit-new") { await doSubmitNew(); return true; }
      if (act === "doc-submit-existing") { await doSubmitExisting(el.dataset.id); return true; }
      if (act === "doc-approve" || act === "doc-reject" || act === "doc-return") {
        const id = (cache.detail && cache.detail.id) || ui.docId;
        const comment = await commentRequired(act === "doc-approve" ? "approve" : (act === "doc-reject" ? "reject" : "return"));
        if (act !== "doc-approve" && comment == null) return true;
        if (act === "doc-approve") cache.detail = await api.approveDocument(id, comment);
        if (act === "doc-reject") cache.detail = await api.rejectDocument(id, comment);
        if (act === "doc-return") cache.detail = await api.returnDocument(id, comment);
        toast(act === "doc-approve" ? "Approved." : (act === "doc-reject" ? "Rejected." : "Returned for changes."));
        L.render();
        hydratePreview(cache.detail);
        return true;
      }
      if (act === "doc-comment") {
        ev && ev.preventDefault();
        const id = (cache.detail && cache.detail.id) || ui.docId;
        const text = (document.getElementById("doc-comment") || {}).value;
        if (!text) { toast("Write a comment first."); return true; }
        cache.detail = await api.commentDocument(id, text);
        L.render();
        hydratePreview(cache.detail);
        return true;
      }
      if (act === "rt-new" || act === "rt-edit") {
        const route = act === "rt-edit" ? (cache.routes || []).find((r) => r.id === el.dataset.id) : null;
        L.openModal ? null : null;
        const html = '<h2>' + (route ? "Edit route" : "New route") + "</h2>" + routeForm(route) +
          '<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-act="close-modal">Cancel</button> ' +
          '<button class="btn btn-primary" id="rt-save">Save</button></div>';
        if (L && document.getElementById) {
          // use the existing modal helper via a lightweight overlay
          let back = document.getElementById("modal-root");
          if (back) back.remove();
          back = document.createElement("div");
          back.id = "modal-root";
          back.className = "modal-back";
          back.innerHTML = '<div class="modal">' + html + "</div>";
          back.addEventListener("click", (e) => { if (e.target === back) back.remove(); });
          document.body.appendChild(back);
          back.querySelector("#rt-save").addEventListener("click", async () => {
            try {
              await collectAndSaveRoute(route && route.id);
              back.remove();
              cache.routes = await api.listRoutes();
              toast("Route saved.");
              L.render();
            } catch (err) { toast(err.message || "Save failed"); }
          });
          back.querySelector("[data-act=close-modal]").addEventListener("click", () => back.remove());
        }
        return true;
      }
      if (act === "rt-del") {
        if (!confirm("Delete this approval route?")) return true;
        await api.deleteRoute(el.dataset.id);
        cache.routes = await api.listRoutes();
        toast("Route deleted.");
        L.render();
        return true;
      }
    } catch (err) {
      toast(err.message || "Action failed");
    }
    return true;
  }

  function bindFilters() {
    const L = global.Logbook;
    const ui = L && (L._ui || (L._ui = {}));
    const q = document.getElementById("doc-q");
    const st = document.getElementById("doc-status");
    function go() {
      if (q) ui.docQ = q.value;
      if (st) ui.docStatus = st.value;
      Promise.resolve(loadDocs(ui)).finally(() => L.render());
    }
    if (q && !q._bound) { q._bound = true; q.addEventListener("change", go); q.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); }); }
    if (st && !st._bound) { st._bound = true; st.addEventListener("change", go); }
    const drop = document.getElementById("sub-drop");
    const file = document.getElementById("sub-file");
    if (drop && file && !drop._bound) {
      drop._bound = true;
      ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
      ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
      drop.addEventListener("drop", (e) => {
        const f = e.dataTransfer.files[0];
        if (f) {
          const dt = new DataTransfer();
          dt.items.add(f);
          file.files = dt.files;
          const name = document.getElementById("sub-file-name");
          if (name) name.textContent = f.name;
        }
      });
      file.addEventListener("change", () => {
        const name = document.getElementById("sub-file-name");
        if (name && file.files[0]) name.textContent = file.files[0].name;
      });
    }
    const cform = document.getElementById("doc-comment-form");
    if (cform && !cform._bound) {
      cform._bound = true;
      cform.addEventListener("submit", (e) => { e.preventDefault(); handleAction("doc-comment", cform, e); });
    }
  }

  function applyBadges() {
    const dash = cache.dash;
    const wo = document.getElementById("nav-wo-count");
    const ap = document.getElementById("nav-appr-count");
    if (dash && wo) {
      wo.hidden = !dash.open_work_orders;
      wo.textContent = dash.open_work_orders || "";
    }
    if (dash && ap) {
      const n = dash.my_pending_approvals || dash.pending_approvals || 0;
      ap.hidden = !n;
      ap.textContent = n || "";
    }
    paintDashChart();
    if (cache.detail) hydratePreview(cache.detail);
  }

  // Hook into v4
  const v4 = global.LogbookV4 || {};
  const prevChrome = v4.applyChrome;
  const prevBefore = v4.beforeView;
  const prevHandle = v4.handleAction;
  const prevBind = v4.bindFilters;
  const prevViews = v4.views || {};

  v4.views = Object.assign({}, prevViews, {
    dashboard: viewDashboard,
    approvals: viewApprovals,
    approvalDetail: viewApprovalDetail,
    docSubmit: viewSubmit,
    routes: viewRoutes,
  });
  v4.applyChrome = function () {
    if (prevChrome) prevChrome();
    applyBadges();
  };
  v4.beforeView = async function (name, ui) {
    if (prevBefore) await prevBefore(name, ui);
    if (name === "dashboard") await loadDash();
    if (name === "approvals" || name === "docSubmit" || name === "routes") await loadDocs(ui || {});
    if (name === "approvalDetail") {
      const id = (ui && ui.docId) || (cache.detail && cache.detail.id);
      if (id) await loadDetail(id);
    }
  };
  v4.handleAction = function (act, el, ev) {
    if (ACTS.has(act)) return handleAction(act, el, ev);
    return prevHandle ? prevHandle(act, el, ev) : false;
  };
  v4.bindFilters = function () {
    if (prevBind) prevBind();
    bindFilters();
  };
  // preload dashboard counts so badges show after first render
  if (global.LogbookAPI) {
    loadDash().catch(() => {});
  }
  global.LogbookV5 = { cache, loadDash, loadDocs, viewDashboard, commentRequired };
})(typeof window !== "undefined" ? window : globalThis);

      host.innerHTML = rows.map(row => `<tr><td><input type="checkbox" aria-label="Select ${esc(row.tag)}"

        <td><strong>${esc(row.tag)}</strong></td><td>${esc(row.name)}</td>
        <td>${esc(row.area)}</td><td>${row.qr_code_issued ? "Reprint" : "New"}</td></tr>`).join("")
        || '<tr><td colspan="5">No equipment matches.</td></tr>';
      get("page").textContent = page + " / " + pages;
      get("prev").disabled = page <= 1;
      get("next").disabled = page >= pages;
    };
    async function preview() {
      const version = ++previewVersion;
      previewObserver?.disconnect();
      const count = selected.size;
      get("selected").textContent = count + " selected";
      get("print").disabled = !count;
      get("sheet-count").textContent = count ? Math.ceil((count + start() - 1) / 21) + " sheet(s) · " + count + " labels" : "";
      if (!count) {
        get("preview").textContent = "Select equipment to preview a sheet.";
        return;
      }
      try {
        const response = await api.authenticatedFetch(url(selected.keys(), true));
        const html = await response.text();
        if (version !== previewVersion || !host.isConnected) return;
        const frame = document.createElement("iframe");
        frame.title = "Label sheet preview";
        frame.setAttribute("sandbox", "");
        frame.srcdoc = html;
        const stage = document.createElement("div");
        stage.className = "qr-preview-stage";
        stage.append(frame);
        get("preview").replaceChildren(stage);
        const sheets = Math.ceil((count + start() - 1) / 21);
        const width = 210 * 96 / 25.4;
        const height = Math.ceil(297 * 96 / 25.4 * sheets);
        frame.style.height = height + "px";
        const fit = () => {
          const scale = Math.min(1, stage.clientWidth / width);
          frame.style.transform = "scale(" + scale + ")";
          stage.style.height = Math.ceil(height * scale) + "px";
        };
        previewObserver?.disconnect();
        previewObserver = new ResizeObserver(fit);
        previewObserver.observe(stage);
        fit();
      } catch (error) { feedback(error.message); }
    }
    async function load() {
      const version = ++loadVersion;
      try {
        const result = await api.listQRLabels({page, page_size:50, q:get("query").value,
          site_id:get("site").value, area_id:get("area").value});
        if (version !== loadVersion || !host.isConnected) return;
        rows = result.items;
        pages = Math.max(1, result.pages);
        rows.forEach(row => { if (selected.has(row.id)) selected.set(row.id, row); });
        renderRows();
      } catch (error) { feedback(error.message); }
    }
    function setAreas() {
      const site = get("site").value;
      const areas = sites.filter(item => !site || item.id === site).flatMap(item => item.areas || []);
      get("area").innerHTML = '<option value="">All areas</option>' + areas.map(area =>
        `<option value="${esc(area.id)}">${esc(area.name)}</option>`).join("");
    }
    api.listSites().then(result => {
      if (!host.isConnected) return;
      sites = result;
      get("site").insertAdjacentHTML("beforeend", sites.map(site =>
        `<option value="${esc(site.id)}">${esc(site.name)}</option>`).join(""));
      setAreas();
      renderRows();
    }).catch(error => feedback(error.message));
    get("url").textContent = location.origin;
    if (window.LogbookV4.can("settings.manage")) api.getPublicURL().then(result => {
      if (host.isConnected && result.public_base_url) get("url").textContent = result.public_base_url;
    }).catch(error => feedback(error.message));
    get("site").onchange = () => { setAreas(); page = 1; load(); };
    get("area").onchange = () => { page = 1; load(); };
    get("query").oninput = () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { if (host.isConnected) { page = 1; load(); } }, 180);
    };
    get("prev").onclick = () => { page--; load(); };
    get("next").onclick = () => { page++; load(); };
    get("start").oninput = preview;
    get("clear").onclick = () => { selected.clear(); renderRows(); preview(); };
    get("select-page").onclick = () => {
      rows.forEach(row => { if (selected.size < 500) selected.set(row.id, row); });
      renderRows();
      preview();
    };
    host.onchange = event => {
      const input = event.target;
      const row = rows.find(item => item.id === input.dataset.equipment);
      if (!row) return;
      if (input.checked && selected.size < 500) selected.set(row.id, row);
      else { selected.delete(row.id); input.checked = false; }
      preview();
    };
    get("print").onclick = async () => {
      const ids = [...selected.keys()];
      if ([...selected.values()].some(row => row.qr_code_issued)
          && !confirm("Replace the existing QR codes for the selected equipment?")) return;
      const tab = window.open("about:blank", "_blank");
      if (!tab) { feedback("Allow popups to print the sheet."); return; }
      get("print").disabled = true;
      try {
        await api.issueQRCodes(ids, true);
        const response = await api.authenticatedFetch(url(ids, false));
        const html = await response.text();
        tab.document.open();
        tab.document.write(html);
        tab.document.close();
        tab.focus();
        tab.print();
        await load();
      } catch (error) { tab.close(); feedback(error.message); }
      finally { if (host.isConnected) get("print").disabled = !selected.size; }
    };
    load();
    preview();
  }

  function viewSettings() {
    return `<h2>Settings</h2><section class="card"><h3>QR server address</h3>
      <form id="qr-url-form"><label class="fld"><span>Public server URL</span>
      <input type="url" name="publicUrl" placeholder="http://logbook.plant.local" maxlength="500"></label>
      <p>Use a hostname that phones on your network can reach.</p>
      <p id="qr-url-warning" hidden>Changing this address can prevent previously printed labels from opening.</p>
      <p id="qr-settings-feedback" role="status"></p><button class="btn btn-primary" disabled>Save address</button></form></section>
      ${window.LogbookV4.can("users.manage") ? '<section class="card"><h3>Sites</h3><div id="site-settings"></div></section>' : ""}`;
  }

  async function bindSettings(form) {
    const status = form.querySelector('[role="status"]');
    const button = form.querySelector("button");
    try {
      let saved = await api.getPublicURL();
      form.publicUrl.value = saved.public_base_url;
      form.querySelector("#qr-url-warning").hidden = !saved.labels_printed;
      button.disabled = false;
      form.onsubmit = async event => {
        event.preventDefault();
        if (saved.labels_printed && saved.public_base_url !== form.publicUrl.value

        button.disabled = true;

        finally { button.disabled = false; }
      };
    } catch (error) { status.textContent = error.message; }
  }

  async function bindSites(host, selectedId) {
    try {

      if (!host.isConnected) return;
      const site = selectedId === undefined ? sites[0] : sites.find(row => row.id === selectedId);
      host.innerHTML = `<label class="fld"><span>Site</span><select id="settings-site">

          `<option value="${esc(row.id)}" ${row === site ? "selected" : ""}>${esc(row.name)}</option>`).join("")}

          <div class="row"><button class="btn btn-primary">${site ? "Save site" : "Create site"}</button></div>

        event.preventDefault();
        const status = form.querySelector('[role="status"]');
        const button = form.querySelector("button");

        button.disabled = true;
        try {
          const saved = await (site ? api.updateSite(site.id, body) : api.createSite(body));
          const state = window.Logbook.getState();
          const meta = state.meta;
          if (state.me?.site_id === saved.id) meta.timezone = saved.timezone || meta.installTimezone;
          meta.siteTimezones[saved.id] = saved.timezone || meta.installTimezone;
          meta.sitesMissingTimezone = meta.sitesMissingTimezone.filter(id => id !== saved.id);
          if (!saved.timezone) meta.sitesMissingTimezone.push(saved.id);
          for (const entry of state.logs) {
            const equipment = state.equipmentIndex.find(row => row.id === entry.equipmentId);
            if (entry.ts && equipment?.site_id === saved.id) {
              Object.assign(entry, window.Logbook.zonedDateTime(new Date(entry.ts), meta.siteTimezones[saved.id]));
            }
          }
          window.Logbook._ui.siteSettingsId = saved.id;
          window.Logbook.render();
          window.Logbook._toast("Site saved.");
        } catch (error) { status.textContent = error.message; }
        finally { button.disabled = false; }

  async function sessions(host, user) {

  async function storage(host) {
    try {
      const result = await api.storage();

      host.innerHTML = "<h3>Attachment storage</h3>" + Object.entries(labels).map(([key, label]) => {

      }).join("");

  function readingValue(value, metadata) {
    if (value == null || value === "") return "—";
    const unit = metadata?.unit;
    const quality = metadata?.quality;
    const badge = quality && quality !== "good" ? ' <span class="pill">' + esc(quality) + "</span>" : "";
    return esc(value) + (unit ? " " + esc(unit) : "") + badge;
  }

  function readingPhotos(photos) {
    return photos?.length ? '<div class="log-photos">' + photos.map(photo =>

  function bindPagedReadingHistory(host) {

    let version = 0;
    async function load(page) {
      const requested = ++version;
      host.textContent = "Loading reading history…";
      try {
        const result = await api.listLogs({equipment_id:selection.value,page,page_size:50});
        if (!host.isConnected || requested !== version) return;
        host.innerHTML = `<div class="table-wrap"><table class="data">

          <tbody>${result.items.map(row => `<tr><td>${esc(row.date)}</td><td>${esc(row.time)}</td>

          <td>${Object.entries(row.readings).map(([key,value]) => esc(key) + ": " + readingValue(value, row.readingMeta?.[key])).join(" · ")}</td>

          || '<tr><td colspan="6">No entries for this equipment.</td></tr>'}</tbody></table></div>
          ${result.pages > 1 ? `<div class="row"><button type="button" class="btn" data-history-page="${page - 1}" ${page <= 1 ? "disabled" : ""}>Previous</button>

        host.querySelectorAll("[data-history-page]").forEach(button => {
          button.onclick = () => load(Number(button.dataset.historyPage));

        if (host.isConnected && requested === version) host.textContent = error.message;
      }
    }
    async function selectEquipment() {
      const id = selection.value;
      const book = window.Logbook;
      book._ui.logEq = id;
      load(1);
      if (!window.LogbookV4.can("readings.write")) return;
      const entry = document.getElementById("paged-log-entry");
      entry.textContent = "";
      try {
        const equipment = await api.getEquipment(id);
        if (!entry.isConnected || id !== selection.value) return;
        book._ui.pagedLogEquipment = equipment;
        entry.innerHTML = book.logEntryForm(equipment);
      } catch (error) {
        if (entry.isConnected && id === selection.value) entry.textContent = error.message;
      }
    }
    selection.onchange = selectEquipment;
    selectEquipment();

  function bindReadingPhotos(root = document) {
    root.querySelectorAll("[data-reading-photo]").forEach(button => {
      const path = "/api/readings/photos/" + encodeURIComponent(button.dataset.readingPhoto);
      const image = button.querySelector("img");
      const load = () => api.authenticatedFetch(path).then(response => response.blob());
      load().then(blob => {
        if (!button.isConnected) return;
        const url = URL.createObjectURL(blob);
        image.onload = image.onerror = () => URL.revokeObjectURL(url);
        image.src = url;
      }).catch(() => { image.alt = "Photo unavailable"; });
      button.onclick = async () => {
        const tab = window.open("about:blank", "_blank");
        if (!tab) { window.Logbook._toast("Allow popups to open the photo."); return; }
        try {
          const url = URL.createObjectURL(await load());
          tab.location.replace(url);
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } catch (error) { tab.close(); window.Logbook._toast(error.message); }
      };
    });
  }

  window.LogentraQR = {
    readingPhotos, readingValue, pagedReadingHistory,
    views:{qrTags:viewTags, settings:viewSettings, profile:() =>
      '<h2>Profile</h2><section class="card"><h3>Phone sessions</h3><div id="qr-own-sessions"></div></section>'},
    bind(view) {
      previewObserver?.disconnect();
      document.getElementById("qr-profile").hidden = window.Logbook.getState().me?.mode !== "user";
      if (view === "qrTags") bindTags();
      if (view === "logbook") {
        const history = document.getElementById("paged-log-history");
        if (history) bindPagedReadingHistory(history);
        else bindReadingPhotos();
      }
      if (view === "settings") {
        bindSettings(document.getElementById("qr-url-form"));
        const host = document.getElementById("site-settings");
        if (host) bindSites(host, window.Logbook._ui.siteSettingsId ?? window.Logbook.getState().me?.site_id ?? undefined);

      if (view === "profile") sessions(document.getElementById("qr-own-sessions"));
      if (view === "backup" && window.LogbookV4.can("settings.manage")) storage(document.getElementById("qr-storage"));
      if (view === "users") document.querySelectorAll("[data-qr-user]").forEach(button => {
        button.onclick = () => {
          const dialog = document.createElement("dialog");
          dialog.innerHTML = '<h3>Phone sessions</h3><div></div><form method="dialog"><button class="btn">Close</button></form>';
          document.body.append(dialog);
          dialog.addEventListener("close", () => dialog.remove(), {once:true});
          dialog.showModal();
          sessions(dialog.querySelector("div"), button.dataset.qrUser);
        };
      });
    }
  };
})();
